[workspace]
resolver = "3"
members = ["src/collector", "src/contract", "src/web"]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
async-nats = "0.48"
clap = { version = "4.5.57", features = ["derive"] }
jiff = { version = "0.2.41", features = ["serde"] }
screentime-contract = { path = "src/contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
